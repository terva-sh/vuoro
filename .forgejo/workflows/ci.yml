# Forgejo CI for vuoro, the gate for internal pull requests.
#
# The steps match `just ci`. The commands are inline because the container
# does not install just, so a change to one belongs in the other.
#
# This is vuoro's only CI (D52). The tests run on linux, on the internal
# runners; darwin and windows are vetted and cross-built, not tested.
#
# Everything runs with CGO_ENABLED=0, the way vuoro ships, except the race
# step. The race detector needs cgo on linux, so that step builds the tests
# with it, and gcc, and nothing it builds ships (D53). The image is 1.27
# because the internal registry is curated and has no proven 1.26 image, so
# go.mod's 1.26 minimum is not what CI tests. Checkout comes from the
# Actions-Mirrors org and Go from the internal registry's golang image, as in
# the other terva-sh repositories.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  check:
    name: Vet, test and cross-build
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.27-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache git bash nodejs npm gcc musl-dev

      - name: Checkout
        uses: Actions-Mirrors/forgejo-actions-checkout@v6

      - name: Install ticket checker
        run: GOBIN=/usr/local/bin go install github.com/terva-sh/git-ticket/cmd/git-ticket@v0.24.0

      - name: go vet (linux, darwin, windows)
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      - name: gofmt check
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go test
        run: go test ./...

      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./...

      - name: Cross-build every target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done

      - name: Design stylesheet matches its pin
        run: go run github.com/terva-sh/design/cmd/design-tokens export -app vuoro -out web/src/styles/design.css -check

      - name: Frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test:unit

      - name: web/dist matches its source
        run: npm run verify:dist

      - name: Ticket store
        run: git ticket check --fix --dry-run --strict
