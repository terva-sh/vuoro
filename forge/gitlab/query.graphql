query mergeRequest($fullPath: ID!, $iid: String!, $after: String) {
  project(fullPath: $fullPath) {
    mergeRequest(iid: $iid) {
      iid title description state draft detailedMergeStatus
      sourceBranch targetBranch webUrl createdAt updatedAt
      author { username bot }
      userPermissions { canMerge }
      diffRefs { baseSha headSha startSha }
      reviewers(first: 100) { pageInfo { hasNextPage } nodes { username bot mergeRequestInteraction { reviewState canMerge } } }
      assignees(first: 100) { pageInfo { hasNextPage } nodes { username bot } }
      participants(first: 100) { pageInfo { hasNextPage } nodes { username bot } }
      mergeRequestDiffs(first: 100) { pageInfo { hasNextPage endCursor } nodes { createdAt } }
      discussions(first: 100, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id resolvable resolved
          notes(first: 100) {
            pageInfo { hasNextPage }
            nodes {
              id author { username bot } createdAt system body resolvable resolved
              position { filePath oldPath newLine oldLine diffRefs { baseSha headSha startSha } }
            }
          }
        }
      }
    }
  }
}
